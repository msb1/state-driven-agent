# Intentionally omits workflow. This tests prompt-guided completion, not an enforced success gate.
# Malformed model responses require fault injection; YAML alone does not create them.
agent:
  name: completion-no-workflow
  system_prompt: |-
    Follow the user request and preserve exact requested response strings.
    For a direct response request, answer directly without calling tools.
    For a log-analysis request, inspect and analyze the log with robust parsing, validate the
    top IP and count, then report the validated result. There is intentionally no workflow gate.
    Never present a tool or model error as a successful task result.
  model: ${MAIN_MODEL:-qwen2.5-7b-instruct-mlx}
  llm:
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:8080/v1}
    api_key_env: OPENAI_API_KEY
    temperature: 0.1
    timeout_seconds: 90
  memory:
    max_tokens: 6000
    max_steps: 12
    raw_turns_to_keep: 3
    hybrid_reflection: true
  tools:
  - name: inspect_log
    description: Return a bounded excerpt of the simulated HTTP access log. Use this before forming a
      parsing strategy.
    parameters:
      type: object
      properties:
        start_line:
          type: integer
          description: First 1-based line to return
          minimum: 1
        line_count:
          type: integer
          description: Number of lines to return
          minimum: 1
          maximum: 100
      required:
      - start_line
      - line_count
  - name: analyze_500_ips
    description: Analyze the simulated log for status-500 IPs. Set robust_parser true to ignore malformed
      records safely.
    parameters:
      type: object
      properties:
        robust_parser:
          type: boolean
          description: Validate each line before accessing fields
      required:
      - robust_parser
  - name: validate_top_offending_ip
    description: Validate a proposed top status-500 IP and its occurrence count against the hidden expected
      result.
    parameters:
      type: object
      properties:
        ip:
          type: string
          description: Proposed IPv4 address
        count:
          type: integer
          description: Proposed number of 500 responses
      required:
      - ip
      - count
  output:
    verbose_setup: true
