# Used only by scripts/disconnect_integration_test.py; no live model or tools.
agent:
  name: socket-integration
  system_prompt: Return the exact final answer requested by the user.
  model: socket-integration
  llm:
    base_url: ${AUX_SOCKET_MODEL_URL:-http://127.0.0.1:18089/v1}
    api_key_env: OPENAI_API_KEY
    temperature: 0
    timeout_seconds: 600
  memory:
    max_tokens: 12000
    max_steps: 2
    run_max_steps: 2
    raw_turns_to_keep: 4
  tools: []
  execution:
    tool_policy: none
  completion:
    exact: SOCKET_INTEGRATION_COMPLETE
  output:
    verbose_setup: false
