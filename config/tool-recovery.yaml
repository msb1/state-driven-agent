# Existing read-only log tools: expected failure -> robust retry -> validation.
# Tests bounded-stop/restart/resume; durable execution IDs and side-effect idempotency are future work.
agent:
  name: tool-recovery
  system_prompt: |-
    Run a read-only tool-error and resume regression. In diagnose_failure, call
    analyze_500_ips with robust_parser=false to capture the expected naive parser error.
    In robust_retry, call analyze_500_ips with robust_parser=true. In validate_result, validate
    the computed top IP and count. Follow the active phase and do not issue a final answer
    before all required evidence exists. Finally return exactly RECOVERY_OK 10.0.0.5 83.
    These tools only read fixture data; this profile does not provide crash-safe side-effect retries.
  model: ${MAIN_MODEL:-qwen2.5-7b-instruct-mlx}
  llm:
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:8080/v1}
    api_key_env: OPENAI_API_KEY
    temperature: 0.1
    timeout_seconds: 90
  memory:
    max_tokens: 20000
    max_steps: 12
    raw_turns_to_keep: 4
    hybrid_reflection: true
  workflow:
    entry_phase: diagnose_failure
    phases:
    - id: diagnose_failure
      name: Capture naive parser failure
      instruction: Call analyze_500_ips with robust_parser=false. The expected ERROR is required evidence.
      allowed_tools:
      - analyze_500_ips
      completion:
      - description: The naive parser error was captured.
        tool: analyze_500_ips
        arguments:
          robust_parser: false
        content_contains:
        - 'ERROR: naive parser failed'
      transitions:
      - to: robust_retry
        when: phase_complete
    - id: robust_retry
      name: Retry with robust parsing
      instruction: Call analyze_500_ips with robust_parser=true and retain the computed top result.
      allowed_tools:
      - analyze_500_ips
      completion:
      - description: Robust parsing computed the expected top result.
        tool: analyze_500_ips
        arguments:
          robust_parser: true
        result:
          top:
          - - 10.0.0.5
            - 83
      transitions:
      - to: validate_result
        when: phase_complete
    - id: validate_result
      name: Validate recovered result
      instruction: Validate top IP 10.0.0.5 and count 83 with validate_top_offending_ip.
      allowed_tools:
      - validate_top_offending_ip
      completion:
      - description: The corrected result was validated.
        tool: validate_top_offending_ip
        arguments:
          ip: 10.0.0.5
          count: 83
        result:
          valid: true
      transitions:
      - to: complete
        when: phase_complete
  tools:
  - name: analyze_500_ips
    description: Analyze the simulated log for status-500 IPs. Set robust_parser true to ignore malformed
      records safely.
    parameters:
      type: object
      properties:
        robust_parser:
          type: boolean
          description: Validate each line before accessing fields
      required:
      - robust_parser
  - name: validate_top_offending_ip
    description: Validate a proposed top status-500 IP and its occurrence count against the hidden expected
      result.
    parameters:
      type: object
      properties:
        ip:
          type: string
          description: Proposed IPv4 address
        count:
          type: integer
          description: Proposed number of 500 responses
      required:
      - ip
      - count
  output:
    verbose_setup: true
  completion:
    exact: "RECOVERY_OK 10.0.0.5 83"
