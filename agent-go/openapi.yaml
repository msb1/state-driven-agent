openapi: 3.1.0
info:
  title: State-Driven AI Agent
  version: 2.0.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: integer
                type: object
                title: Response Health Health Get
  /configs:
    get:
      summary: List Configs
      operationId: list_configs_configs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Configs Configs Get
  /sessions:
    post:
      summary: Create Session
      operationId: create_session_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Invalid key or request before admission
        '202':
          description: Existing unresolved command; Retry-After and command identity
            returned
        '409':
          description: Conflicting key, ownership or lifecycle
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
  /sessions/{session_id}:
    get:
      summary: Get Session
      operationId: get_session_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/transcript:
    get:
      summary: Get Transcript
      operationId: get_transcript_sessions__session_id__transcript_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: after_sequence
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After Sequence
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: through_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Through Sequence
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Transcript Sessions  Session Id  Transcript Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/messages:
    post:
      summary: Append User Message
      operationId: append_user_message_sessions__session_id__messages_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendUserMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Invalid key or request before admission
        '202':
          description: Existing unresolved command; Retry-After and command identity
            returned
        '409':
          description: Conflicting key, ownership or lifecycle
  /sessions/{session_id}/runs:
    get:
      summary: Get Runs
      operationId: get_runs_sessions__session_id__runs_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/diagnostics/{family}:
    get:
      summary: Get Diagnostics
      operationId: get_diagnostics_sessions__session_id__diagnostics__family__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: family
        in: path
        required: true
        schema:
          type: string
          title: Family
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: through
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Through
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/events:
    get:
      summary: Get Events
      operationId: get_events_sessions__session_id__events_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: through
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Through
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/archives:
    get:
      summary: Get Archives
      operationId: get_archives_sessions__session_id__archives_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/retention:
    get:
      summary: Retention Plan
      operationId: retention_plan_sessions__session_id__retention_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/executions:
    get:
      summary: Get Executions
      operationId: get_executions_sessions__session_id__executions_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/cancel:
    post:
      summary: Cancel Session
      operationId: cancel_session_sessions__session_id__cancel_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Invalid key or request before admission
        '202':
          description: Existing unresolved command; Retry-After and command identity
            returned
        '409':
          description: Conflicting key, ownership or lifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - run_id
              properties:
                run_id:
                  type: string
                  format: uuid
  /runs/abandoned:
    get:
      summary: Abandoned Runs
      operationId: abandoned_runs_runs_abandoned_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/run:
    post:
      summary: Run Session
      operationId: run_session_sessions__session_id__run_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Invalid key or request before admission
        '202':
          description: Existing unresolved command; Retry-After and command identity
            returned
        '409':
          description: Conflicting key, ownership or lifecycle
  /sessions/{session_id}/run/stream:
    post:
      summary: Stream Run Session
      operationId: stream_run_session_sessions__session_id__run_stream_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Invalid key or request before admission
        '202':
          description: Existing unresolved command; Retry-After and command identity
            returned
        '409':
          description: Conflicting key, ownership or lifecycle
  /sessions/{session_id}/resume:
    post:
      summary: Resume Session
      operationId: resume_session_sessions__session_id__resume_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeSessionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Invalid key or request before admission
        '202':
          description: Existing unresolved command; Retry-After and command identity
            returned
        '409':
          description: Conflicting key, ownership or lifecycle
  /commands/{command_id}:
    get:
      summary: Retrieve a durable command in the local client scope
      parameters:
      - name: command_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authoritative command status, outcome and recovery information
        '404':
          description: Command not found
        '422':
          description: Invalid UUID
components:
  schemas:
    AppendUserMessageRequest:
      properties:
        content:
          type: string
          minLength: 1
          title: Content
          description: Additional user input appended to the active session memory.
      type: object
      required:
      - content
      title: AppendUserMessageRequest
    CreateSessionRequest:
      properties:
        user_prompt:
          type: string
          minLength: 1
          title: User Prompt
          description: The user's goal; becomes the first session-memory message.
        config_ref:
          type: string
          minLength: 1
          title: Config Ref
          description: Relative YAML path inside the server-approved config repository.
          default: log-analysis.yaml
      type: object
      required:
      - user_prompt
      title: CreateSessionRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Message:
      properties:
        message_id:
          type: string
          title: Message Id
        sequence:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Sequence
        created_at:
          type: string
          format: date-time
          title: Created At
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
          title: Role
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        tool_call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Call Id
        tool_calls:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Tool Calls
      type: object
      required:
      - role
      title: Message
    ResumeSessionRequest:
      properties:
        max_steps:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Max Steps
        content:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Content
      type: object
      title: ResumeSessionRequest
      description: Continue a terminal session, optionally with a new user turn.
    RunRequest:
      properties:
        max_steps:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Max Steps
      type: object
      title: RunRequest
    SessionResponse:
      properties:
        session:
          $ref: '#/components/schemas/SessionState'
        message:
          type: string
          title: Message
      type: object
      required:
      - session
      - message
      title: SessionResponse
    SessionState:
      properties:
        id:
          type: string
          title: Id
        goal:
          type: string
          title: Goal
        config_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Ref
        config_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Sha256
        resolved_config_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolved Config Sha256
        revision:
          type: integer
          minimum: 0.0
          title: Revision
          default: 0
        next_transcript_sequence:
          type: integer
          minimum: 1.0
          title: Next Transcript Sequence
          default: 1
        transcript_pending:
          items:
            $ref: '#/components/schemas/TranscriptEntry'
          type: array
          title: Transcript Pending
        active_ledger_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Ledger Id
        history_complete:
          type: boolean
          title: History Complete
          default: true
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        pending_commit_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pending Commit Id
        run_status:
          type: string
          enum:
          - idle
          - running
          - complete
          - failed
          - cancelled
          - interrupted
          - blocked
          title: Run Status
          default: idle
        run_started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Run Started At
        run_ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Run Ended At
        run_termination_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Termination Reason
        pending_tool_calls:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Pending Tool Calls
        consecutive_invalid_responses:
          type: integer
          title: Consecutive Invalid Responses
          default: 0
        no_progress_steps:
          type: integer
          title: No Progress Steps
          default: 0
        progress_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Progress Fingerprint
        progress_seen_outputs:
          items:
            type: string
          type: array
          title: Progress Seen Outputs
        last_error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Last Error
        completion_artifacts:
          additionalProperties:
            additionalProperties: true
            type: object
          type: object
          title: Completion Artifacts
        memory:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Memory
        compacted_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Compacted Context
        ledger_state:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ledger State
        last_compaction_step:
          type: integer
          title: Last Compaction Step
          default: 0
        last_compaction_attempt_step:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Compaction Attempt Step
        last_compaction_estimated_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Compaction Estimated Tokens
        last_compaction_attempt_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Compaction Attempt Sha256
        compaction_decisions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Compaction Decisions
        compaction_skip_counts:
          additionalProperties:
            type: integer
          type: object
          title: Compaction Skip Counts
        compaction_trigger_counts:
          additionalProperties:
            type: integer
          type: object
          title: Compaction Trigger Counts
        compaction_attempts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Compaction Attempts
        request_budget:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Request Budget
        compaction_events:
          items:
            type: string
          type: array
          title: Compaction Events
        diagnostic_counts:
          additionalProperties:
            type: integer
          type: object
          title: Diagnostic Counts
        diagnostics_complete:
          type: boolean
          title: Diagnostics Complete
          default: true
        diagnostic_history_complete:
          type: boolean
          title: Diagnostic History Complete
          default: true
        diagnostic_rejections:
          type: integer
          title: Diagnostic Rejections
          default: 0
        compaction_savings_total:
          type: integer
          title: Compaction Savings Total
          default: 0
        compaction_savings_known:
          type: boolean
          title: Compaction Savings Known
          default: true
        last_archive_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Archive Id
        workflow:
          anyOf:
          - $ref: '#/components/schemas/WorkflowState'
          - type: 'null'
        step_count:
          type: integer
          title: Step Count
          default: 0
        run_count:
          type: integer
          title: Run Count
          default: 0
        status:
          type: string
          enum:
          - active
          - complete
          - failed
          title: Status
          default: active
        final_answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Final Answer
      type: object
      required:
      - id
      - goal
      title: SessionState
    TranscriptEntry:
      properties:
        message_id:
          type: string
          title: Message Id
        sequence:
          type: integer
          minimum: 1.0
          title: Sequence
        kind:
          type: string
          title: Kind
        payload:
          additionalProperties: true
          type: object
          title: Payload
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        decision_step:
          type: integer
          minimum: 0.0
          title: Decision Step
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - sequence
      - kind
      - payload
      - decision_step
      title: TranscriptEntry
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkflowState:
      properties:
        active_phase:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Phase
        completed_phases:
          items:
            type: string
          type: array
          title: Completed Phases
        observed_evidence:
          items:
            type: string
          type: array
          title: Observed Evidence
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransition'
          type: array
          title: Transitions
      type: object
      required:
      - active_phase
      title: WorkflowState
      description: Persistent workflow facts kept outside compactable raw message
        history.
    WorkflowTransition:
      properties:
        from_phase:
          type: string
          title: From Phase
        to_phase:
          type: string
          title: To Phase
        reason:
          type: string
          title: Reason
      type: object
      required:
      - from_phase
      - to_phase
      - reason
      title: WorkflowTransition
