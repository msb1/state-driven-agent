openapi: 3.1.0
info: {title: State-Driven AI Agent, version: 0.2.0}
paths:
  /health: {get: {responses: {'200': {description: healthy}}}}
  /configs: {get: {responses: {'200': {description: configurations}}}}
  /sessions: {post: {responses: {'201': {description: created}, '422': {description: invalid config}}}}
  /sessions/{session_id}: {get: {parameters: [{name: session_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: state}, '404': {description: missing}}}}
  /sessions/{session_id}/messages: {post: {parameters: [{name: session_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: appended}, '409': {description: terminal}}}}
  /sessions/{session_id}/run: {post: {parameters: [{name: session_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: run result}}}}
  /sessions/{session_id}/run/stream: {post: {parameters: [{name: session_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: SSE, content: {'text/event-stream': {schema: {type: string}}}}}}}
  /sessions/{session_id}/resume: {post: {parameters: [{name: session_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: SSE, content: {'text/event-stream': {schema: {type: string}}}}}}}
