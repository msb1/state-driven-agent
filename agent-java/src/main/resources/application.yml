server:
  # One listener per port; workers on distinct ports coordinate through PostgreSQL.
  port: "${PORT:8000}"
spring:
  r2dbc:
    url: "${AGENT_SESSION_R2DBC_URL:r2dbc:postgresql://192.168.1.50:5432/universal_state}"
    username: "${AGENT_SESSION_DB_USER:user}"
    password: "${AGENT_SESSION_DB_PASSWORD:password}"
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
    url: /openapi.json
