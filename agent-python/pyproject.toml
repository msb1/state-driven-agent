[project]
name = "agent-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "msb1", email = "44041613+msb1@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
agent-python = "agent_python.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
